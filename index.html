<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Manga Casting Call</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Lato', sans-serif;
        background-color: #040f1a;
        background-image:
          radial-gradient(
            at 20% 20%,
            hsla(208, 60%, 33%, 0.2) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 80% 0%,
            hsla(195, 100%, 28%, 0.25) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 80% 80%,
            hsla(188, 67%, 93%, 0.1) 0px,
            transparent 50%
          );
      }
      .font-cinzel {
        font-family: 'Cinzel', serif;
      }
      .font-lato {
        font-family: 'Lato', sans-serif;
      }

      /* Standard Scrollbar Styles (Firefox) */
      * {
        scrollbar-width: thin;
        scrollbar-color: #016f93 #0f172a;
      }

      /* Custom Scrollbar Styles (Webkit/Chrome/Safari) */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #016f93;
        border-radius: 6px;
        border: 3px solid #0f172a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #015a7a;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
        }
      }
    </script>
  </head>
  <body>
    <!-- Netlify Hidden Forms for Detection -->
    <form name="casting-call" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="radio" name="age" />
      <input type="radio" name="experience" />
      <textarea name="equipment"></textarea>
      <input type="text" name="portfolioLink" />
      <input type="radio" name="primaryRole" />
      <input type="text" name="otherRoles" />
      <input type="checkbox" name="notify" />
      <input type="file" name="audition-file" />
      <input type="text" name="googleDriveLink" />
    </form>

    <form name="mailing-list" netlify netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
    </form>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
